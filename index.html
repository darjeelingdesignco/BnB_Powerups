<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Bop'nBounce</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <!-- Loading Animation -->
    <div id="loading-screen">
        <div id="logo-container">
            <div id="logo-overlay"></div>
        </div>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-warning"></div>
    </div>
    <div id="rotateDeviceMessage">
        <div class="overlay">
            <!--<img src="GameName.png" class="element img-top" alt="Bop'n Bounce">
            <div class="element text-40">Please!</div>
            <img src="iPhone 14 Pro.png" class="element img-center" alt="Mobile img">
            <div class="element text-60">Rotate Your Phone.</div>
            <img src="BopImage.png" class="element img-bottom-left" alt="Bop image">-->

            <div class="img-top"></div>
            <div class="img-center"></div>
            <div class="text-60">Rotate your phone</div>
            <div class="img-bottom-left"></div>
        </div>
    </div>
    <script>
        function resizeUnityCanvas() {
            const gameContainer = document.getElementById('unity-container'); // or your canvas wrapper
            const unityCanvas = document.getElementById('unity-canvas');

            // Get actual visible height excluding browser UI
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;

            // Apply to container and canvas
            gameContainer.style.width = vw + 'px';
            gameContainer.style.height = vh + 'px';
            unityCanvas.style.width = vw + 'px';
            unityCanvas.style.height = vh + 'px';
        }

        window.addEventListener('resize', resizeUnityCanvas);
        window.addEventListener('orientationchange', () => {
            // Delay resize until browser finishes adjusting bars
            setTimeout(resizeUnityCanvas, 500);
        });

        window.addEventListener('load', resizeUnityCanvas);

        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const warningBanner = document.getElementById("unity-warning");
        const loadingScreen = document.getElementById("loading-screen");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }

            const div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px;';
            } else {
                if (type === 'warning') {
                    div.style = 'background: yellow; padding: 10px;';
                }
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/BnB_F_2.loader.js";
        const config = {
            dataUrl: buildUrl + "/BnB_F_2.data",
            frameworkUrl: buildUrl + "/BnB_F_2.framework.js",
            codeUrl: buildUrl + "/BnB_F_2.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "darjeelingdesignco.",
            productName: "Bop'nBounce",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const overlay = document.getElementById('logo-overlay');
                if (overlay) {
                    overlay.style.transform = `translateX(${progress * 100}%)`;
                }
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;

                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.5s ease-out';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        container.style.display = 'block';
                    }, 500);
                }, 500);
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
