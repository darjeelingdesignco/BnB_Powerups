<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Bop'nBounce</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
    <!-- Loading Animation -->
    <div id="loading-screen">
        <div id="logo-container">
            <div id="logo-overlay"></div>
        </div>
    </div>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <input id="mobileInput" type="text">
        <div id="unity-warning"></div>
    </div>
    <div id="rotateDeviceMessage">
        <div class="overlay">
            <div class="img-top"></div>
            <div class="img-center"></div>
            <div class="text-60">Rotate your phone</div>
            <div class="img-bottom-left"></div>
        </div>
    </div>

    <script>
        var unityInstance = null;

        function isMobileDevice() {
            return (
                /Android|iPhone|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) ||
                (navigator.userAgent.includes("iPad")) ||
                (navigator.maxTouchPoints && navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent))
            );
        }

        function ShowMobileKeyboard(gameObjectName, methodName, x, y, width, height) {
    if (!isMobileDevice()) return;

    const input = document.getElementById('mobileInput');
    input.style.left = x + 'px';
    input.style.top = y + 'px';
    input.style.width = width + 'px';
    input.style.height = height + 'px';
    input.value = '';
    input.style.display = 'block';
    input.focus();

    // Send value on every change
    input.oninput = () => {
        unityInstance.SendMessage(gameObjectName, methodName, input.value);
    };

    // Close keyboard if clicking outside (iPad fix)
    const outsideHandler = (event) => {
        if (event.target !== input) {
            input.blur();
            document.removeEventListener('touchstart', outsideHandler);
            document.removeEventListener('mousedown', outsideHandler);
        }
    };
    document.addEventListener('touchstart', outsideHandler);
    document.addEventListener('mousedown', outsideHandler);

    // Hide on blur
    input.onblur = () => {
        input.style.display = 'none';
    };
}
    </script>

    <script>
        function resizeUnityCanvas() {
            const gameContainer = document.getElementById('unity-container'); // or your canvas wrapper
            const unityCanvas = document.getElementById('unity-canvas');

            // Get actual visible height excluding browser UI
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;

            // Apply to container and canvas
            gameContainer.style.width = vw + 'px';
            gameContainer.style.height = vh + 'px';
            unityCanvas.style.width = vw + 'px';
            unityCanvas.style.height = vh + 'px';
        }

        window.addEventListener('resize', resizeUnityCanvas);
        window.addEventListener('orientationchange', () => {
            // Delay resize until browser finishes adjusting bars
            setTimeout(resizeUnityCanvas, 500);
        });

        window.addEventListener('load', resizeUnityCanvas);

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");
    var loadingScreen = document.getElementById('loading-screen');


      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BnB_F_6.loader.js";
      var config = {
        dataUrl: buildUrl + "/BnB_F_6.data",
        frameworkUrl: buildUrl + "/BnB_F_6.framework.js",
        codeUrl: buildUrl + "/BnB_F_6.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "darjeelingdesignco.",
        productName: "Bop'nBounce",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

          canvas.style.width = "100%";
          canvas.style.height = "100%";
      }


    var unityLoaded = false;

    // Handle Unity loading
    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Progress goes from 0 to 1
        const overlay = document.getElementById('logo-overlay');
        if (overlay) {
          overlay.style.transform = `translateX(${progress * 100}%)`;
        }
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        unityLoaded = true;

        // Once Unity is fully loaded, fade out loading screen
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.5s ease-out';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            container.style.display = 'block';
          }, 500);
        }, 500);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);

    </script>
</body>
</html>
