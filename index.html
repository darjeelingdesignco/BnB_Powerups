<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Bop'nBounce</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">    
</head>

<body>
    <!-- Loading Animation -->
    <div id="loading-screen">
        <div id="logo-container">
            <div id="logo-overlay"></div>
        </div>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-warning"></div>
    </div>

    <script>
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const warningBanner = document.getElementById("unity-warning");
        const loadingScreen = document.getElementById("loading-screen");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }

            const div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px;';
            } else {
                if (type === 'warning') {
                    div.style = 'background: yellow; padding: 10px;';
                }
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/BnB_F.loader.js";
        const config = {
            dataUrl: buildUrl + "/BnB_F.data",
            frameworkUrl: buildUrl + "/BnB_F.framework.js",
            codeUrl: buildUrl + "/BnB_F.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "darjeelingdesignco.",
            productName: "Bop'nBounce",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const overlay = document.getElementById('logo-overlay');
                if (overlay) {
                    overlay.style.transform = `translateX(${progress * 100}%)`;
                }
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;

                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.5s ease-out';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        container.style.display = 'block';
                    }, 500);
                }, 500);
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
