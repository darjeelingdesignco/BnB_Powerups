<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Bop'nBounce</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />        
</head>

<body>
    <!-- Loading Animation -->
    <div id="loading-screen">
        <div id="logo-container">
            <div id="logo-overlay"></div>
        </div>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-warning"></div>
    </div>

    <script>
        const container = document.getElementById("unity-container");
        const canvas = document.getElementById("unity-canvas");
        const warningBanner = document.getElementById("unity-warning");
        const loadingScreen = document.getElementById("loading-screen");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }

            const div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px;';
            } else {
                if (type === 'warning') {
                    div.style = 'background: yellow; padding: 10px;';
                }
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/BnB_F_2.loader.js";
        const config = {
            dataUrl: buildUrl + "/BnB_F_2.data",
            frameworkUrl: buildUrl + "/BnB_F_2.framework.js",
            codeUrl: buildUrl + "/BnB_F_2.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "darjeelingdesignco.",
            productName: "Bop'nBounce",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        function adjustCanvasForOrientation() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const isPortrait = window.matchMedia("(orientation: portrait)").matches;

            const targetAspect = 16 / 9; // 🎯 Unity game aspect ratio
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            if (isMobile && isPortrait) {
                // We're rotating the canvas, so we flip screen width & height
                const rotatedWidth = screenH;
                const rotatedHeight = screenW;

                // Maintain aspect ratio within the rotated screen
                let finalWidth = rotatedWidth;
                let finalHeight = rotatedWidth / targetAspect;

                if (finalHeight > rotatedHeight) {
                    finalHeight = rotatedHeight;
                    finalWidth = rotatedHeight * targetAspect;
                }

                container.style.position = "fixed";
                container.style.top = "50%";
                container.style.left = "50%";
                container.style.transform = "translate(-50%, -50%) rotate(90deg)";
                container.style.transformOrigin = "center center";
                container.style.width = finalWidth + "px";
                container.style.height = finalHeight + "px";

                canvas.style.width = "100%";
                canvas.style.height = "100%";
            } else {
                // Normal (landscape or desktop)
                container.style.transform = "none";
                container.style.position = "fixed";
                container.style.top = "0";
                container.style.left = "0";
                container.style.width = "100vw";
                container.style.height = "100vh";

                canvas.style.width = "100%";
                canvas.style.height = "100%";
            }
        }

        window.addEventListener('resize', adjustCanvasForOrientation);
        window.addEventListener('orientationchange', adjustCanvasForOrientation);
        adjustCanvasForOrientation(); // Initial run

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const overlay = document.getElementById('logo-overlay');
                if (overlay) {
                    overlay.style.transform = `translateX(${progress * 100}%)`;
                }
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;

                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.5s ease-out';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        container.style.display = 'block';
                    }, 500);
                }, 500);
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
